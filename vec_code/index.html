<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>shopping cart application</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
<script src="script2.js"></script>
</head>
<body>
    <header>
        <div class="main-container">
            <div class="left-head">
                <a>Home</a>
                <a>About me</a>
                 </div>  
                 <h1><i class="fa-solid fa-book-bookmark"></i>Bookitt</h1>
                <div class="nav-bar">
                    <a class="sign-in">Sign in </a>
                    <a>IMG</a>
               </div>
        </div>
    </header>
    <main>
        <div class="input-bar">
            <i class="fa-solid fa-magnifying-glass"></i><input type="text" class="search-bar" placeholder="add any books you would like" id="box"><button class="search-btn" onclick="addItem(); document.getElementById('list').style.display='block';">Add</button>
        </div>
        <hr>
        <div class="main-content">
            <div class="sub-contents">
                <button class="top-bar"><a><i class="fa-solid fa-book"></i>Your Library</a></button>                
                <button class="top-bar"><a><i class="fa-solid fa-heart"></i>Favorites</a></button>
                <button class="top-bar"><a><i class="fa-brands fa-hive"></i>Recently viewed</a></button>
                <button class="top-bar"><a><i class="fa-brands fa-odysee"></i>Categories</a></button>                    
            </div>
            <div id="list" class="my-list">
                <button class="remove"><i class="fa-solid fa-x"></i></button>
            </div>
        </div>
    </main>
    <footer>
    </footer>
</body>
</html>
